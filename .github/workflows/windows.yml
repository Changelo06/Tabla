name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build and verify a portable Windows package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated test modules
        run: python scripts/run_tests.py
      - name: Build and verify portable package
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: python scripts/package_release.py
      - name: Upload checked package
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: Tabla-Windows
          path: release/*
          if-no-files-found: error
